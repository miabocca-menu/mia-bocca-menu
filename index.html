<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mia Bocca メニュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Serif+SC:wght@400;600&family=Noto+Serif+TC:wght@400;600&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: the restaurant's own printed menu, made tappable — calm, legible, hospitable
   IDEA: the laminated menu book on the table: cover first, then red serif section titles and photos
   PICTURE: the real cover and the real dish photos, untouched
   COLOUR and TYPE: menu paper white, heading red #9b1b30, brown footer band #6b3a1f, Hokkaido green accent; Mincho (Noto Serif JP/TC/SC)
   LAYOUT: sticky language + section bar, card grid of dishes, tap opens a sheet with the 8 allergens */
:root{color-scheme:light dark;--bg:light-dark(#fffdf8,#14110f);--card:light-dark(#fff,#211b18);--ink:light-dark(#221a16,#f3ebe3);--mute:light-dark(#6a5f57,#b5a89d);--red:light-dark(#b5001f,#ff6b7f);--brown:light-dark(#5a2e18,#3d2214);--green:light-dark(#00703a,#5fcf8d);--gtint:light-dark(#eef7f1,#16261c);--rtint:light-dark(#fdf0f1,#2a1619);--line:light-dark(#e8dfd4,#3a302a);--tri:light-dark(#c8102e,#ff8a8a);--flag:linear-gradient(90deg,#00923f 0 33.33%,#f4f1ea 33.33% 66.66%,#c8102e 66.66%)}
.flag{height:5px;background:var(--flag)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;overflow-x:clip}
html[lang=zh-Hant] body{font-family:"Noto Serif TC","Noto Serif JP",serif}
html[lang=zh-Hans] body{font-family:"Noto Serif SC","Noto Serif JP",serif}
html[lang=ko] body{font-family:"Noto Serif KR","Noto Serif JP",serif}.ko{font-family:"Noto Serif KR","Noto Serif JP",serif}
.zt{font-family:"Noto Serif TC","Noto Serif JP",serif}.zs{font-family:"Noto Serif SC","Noto Serif JP",serif}
html{scroll-padding-top:120px}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(8px);box-shadow:0 2px 10px -6px #0004}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px max(4vw,12px)}
.logo{display:flex;flex-direction:column;line-height:1.15;white-space:nowrap}.logo strong{font-size:20px;color:var(--red);font-weight:700}.logo span{font-size:11px;letter-spacing:.04em;color:var(--green)}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{min-height:40px;padding:0 11px;border:1.5px solid var(--green);background:var(--card);color:var(--green);border-radius:20px;font-size:14px;cursor:pointer;font-weight:600}
.langs button[aria-pressed=true]{background:var(--green);color:#fff}
button:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.scroll{display:flex;gap:6px;overflow-x:auto;padding:6px max(4vw,12px) 10px;scrollbar-width:none}
.scroll a{flex:none;text-decoration:none;color:var(--red);font-size:14px;font-weight:600;padding:8px 14px;border-radius:18px;background:var(--rtint);border:1.5px solid color-mix(in srgb,var(--red) 35%,transparent)}
.scroll a:hover{background:var(--red);color:#fff}
.scroll a.al{background:var(--green);color:#fff;border-color:var(--green)}
.cover{display:block;text-align:center;max-width:680px;margin:0 auto;padding:clamp(20px,4vw,48px) max(4vw,16px)}
.cover img{width:100%;border-radius:6px;box-shadow:0 18px 40px -18px #0006;display:block}
.cover h1{font-size:clamp(24px,3.4vw,32px);line-height:1.2;margin:0 0 10px;color:var(--green);text-wrap:balance}
.brand{display:block;width:min(300px,75%);margin:0 auto 18px;border-radius:8px;background:#fff;padding:10px}
.welcome{font-size:17px;line-height:1.8;color:var(--ink)!important;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:0 0 16px!important}
.cover p{margin:0 0 12px;color:var(--mute)}
.cta{display:inline-flex;align-items:center;min-height:50px;padding:0 26px;border-radius:25px;background:var(--red);color:#fff;text-decoration:none;font-weight:600;box-shadow:0 6px 16px -8px var(--red)}
.filter{max-width:1240px;margin:0 auto 8px;padding:16px max(4vw,16px);}
.fbox{background:var(--gtint);border:1.5px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:12px;padding:16px 18px}
.fbox h3{margin:0 0 4px;font-size:18px;color:var(--green)}.fbox p{margin:0 0 10px;font-size:14px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:44px;padding:0 15px;border-radius:22px;border:1.5px solid color-mix(in srgb,var(--green) 45%,transparent);background:var(--card);cursor:pointer;font-size:15px;font-weight:600}
.chips button[aria-pressed=true]{background:var(--red);color:#fff;border-color:var(--red)}
.chips button[aria-pressed=true]::before{content:'✕ '}
.tri{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.tri input{width:22px;height:22px;accent-color:var(--red)}
section.cat{max-width:1240px;margin:0 auto;padding:22px max(4vw,16px) 8px}
.cat .flag{width:90px;height:4px;border-radius:2px;margin:0 0 12px}
.cat h2{font-size:clamp(30px,5vw,42px);line-height:1.05;margin:0 0 4px;color:var(--red);font-weight:600;letter-spacing:.01em}
.cat .sub{color:var(--green);margin:0 0 16px;font-size:15px;font-weight:600}
section.cat+section.cat{border-top:1px solid var(--line);margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.item{all:unset;box-sizing:border-box;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px -6px #0003;overflow:hidden;cursor:pointer;transition:transform .15s,opacity .2s}
.item:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.item:hover{transform:translateY(-2px);border-color:var(--green)}
.item .ph{aspect-ratio:4/3;background:var(--line);overflow:hidden}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .tx{padding:11px 13px 13px;display:flex;flex-direction:column;gap:3px;flex:1}
.no{color:var(--red);font-size:14px}
.nm{font-weight:600;font-size:16.5px;line-height:1.4}
.jp{font-size:13px;color:var(--mute);line-height:1.45}
.pr{margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.yen{font-size:17px;font-weight:600;white-space:nowrap;color:var(--red)}.yen small{font-size:13px;color:var(--mute);font-weight:400}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots span{font-size:13px;padding:1px 6px;border-radius:9px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.dots span.t{color:var(--tri);border-color:color-mix(in srgb,var(--tri) 40%,transparent)}
.item.textonly .ph{display:none}
.item.dim{opacity:.38}
.item .warn{display:none;font-size:13px;color:#fff;background:var(--red);padding:3px 8px;border-radius:6px;align-self:flex-start}
.item.dim .warn{display:inline-block}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);white-space:normal;min-width:180px;max-width:260px;border-right:1px solid var(--line)}
thead th{background:var(--green);color:#fff;font-weight:600;font-size:13px}thead th:first-child{background:var(--green)}
td.o{font-size:16px}td.t{color:var(--tri)}td.n{color:var(--mute)}
tr.grp td{background:var(--rtint);color:var(--red);font-weight:600;text-align:left}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0;font-size:14px}
.legend .t{color:var(--tri)}
.note{font-size:14px;color:var(--mute);line-height:1.7}
footer{margin-top:0;background:var(--brown);color:#f3e7dc;padding:22px max(4vw,16px);font-size:14px}
footer div{max-width:1240px;margin:0 auto}
#sheet{position:fixed;inset:0;z-index:50;display:none;background:#0008;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.panel{background:var(--card);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;animation:up .22s ease-out}
@media(min-width:700px){#sheet{align-items:center}.panel{border-radius:14px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}.item{transition:none}}
.panel img{width:100%;max-height:340px;object-fit:cover;display:block}
.pb{padding:16px 18px 22px}
.pb h3{margin:2px 0 6px;font-size:22px;line-height:1.3}
.names{margin:0 0 12px;font-size:14px;color:var(--mute);line-height:1.6}
.agrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}
.agrid div{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:13px;line-height:1.3}
.agrid b{display:block;font-size:22px;line-height:1.2;margin-bottom:2px}
.agrid .o{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.agrid .t{border-color:var(--tri);color:var(--tri)}
.agrid .n{color:var(--mute)}
.close{position:sticky;top:8px;float:right;margin:8px 8px -52px 0;width:44px;height:44px;border-radius:22px;border:0;background:var(--red);color:#fff;font-size:22px;cursor:pointer;z-index:2}
.unk{padding:12px;border:1px dashed var(--tri);border-radius:8px;color:var(--tri);font-size:14px}
@media(max-width:600px){.cover{grid-template-columns:1fr}.cover img{max-width:420px;margin:0 auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.nm{font-size:15px}.item .tx{padding:9px 10px 11px}.top{flex-wrap:wrap;row-gap:6px}.logo{flex-direction:row;align-items:baseline;gap:8px}.logo strong{font-size:18px}.logo span{font-size:10px}.langs{width:100%;flex-wrap:nowrap;gap:4px}.langs button{flex:1;padding:0 4px;font-size:13px;min-height:38px}.agrid div{font-size:12px}}
</style>
</head>
<body>
<header>
  <div class="top"><div class="logo"><strong>Mia Bocca</strong><span>HOKKAIDO ITALIAN</span></div><div class="langs" id="langs"></div></div>
  <nav class="scroll" id="nav"></nav>
  <div class="flag"></div>
</header>

<div class="cover">
  <div>
    <img class="brand" src="img/logo.png" alt="Mia Bocca 北海道イタリアンバル さいたま新都心店">
    <p class="welcome" id="t-welcome"></p>
    <h1 id="t-title"></h1>
    <p id="t-lead"></p>
    <a class="cta" href="#cold" id="t-cta"></a>
  </div>
</div>

<div class="filter" id="allergy-filter">
  <div class="fbox">
    <h3 id="t-fh"></h3><p id="t-fp"></p>
    <div class="chips" id="chips"></div>
    <label class="tri"><input type="checkbox" id="incTri"><span id="t-tri"></span></label>
  </div>
</div>

<main id="menu"></main>

<section class="cat" id="table">
  <div class="flag"></div><h2 id="t-th"></h2><p class="sub" id="t-ts"></p>
  <div class="legend" id="legend"></div>
  <div class="tablewrap"><table id="atable"></table></div>
  <p class="note" id="t-disc"></p>
</section>

<div class="flag"></div><footer><div>Mia Bocca 北海道イタリアンバル ・ <span id="t-upd"></span> ・ Sendai &amp; Tokyo</div></footer>

<div id="sheet" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>

<script>
{
const AL={ja:['えび','かに','くるみ','小麦','そば','卵','乳','落花生'],en:['Shrimp','Crab','Walnut','Wheat','Buckwheat','Egg','Milk','Peanut'],zt:['蝦','蟹','核桃','小麥','蕎麥','蛋','乳','花生'],zs:['虾','蟹','核桃','小麦','荞麦','蛋','乳','花生'],ko:['새우','게','호두','밀','메밀','달걀','우유','땅콩']};
const UI={
ja:{welcome:'ようこそ、ミア・ボッカへ。本日はご来店いただき、誠にありがとうございます。北海道の食材を使ったイタリアンを、どうぞごゆっくりお楽しみください。',title:'メニュー & アレルギー情報',lead:'料理をタップすると、特定原材料8品目(えび・かに・くるみ・小麦・そば・卵・乳・落花生)の使用状況が見られます。',cta:'メニューを見る',fh:'避けたい食材',fp:'選ぶと、その食材を原材料に使っている料理が薄く表示されます。',tri:'製造ラインの共有・接触(▲)がある料理も薄くする',th:'アレルギー一覧表',ts:'特定原材料 8品目',o:'原材料として使用しています',t:'原材料の製造ラインで共有・接触があります',n:'原材料として使用していません',tax:'税込',contains:'含まれています',unk:'この料理はアレルギー表に記載がありません。スタッフにお尋ねください。',all:'アレルギー表',other:'その他(表のみ記載)',upd:'アレルギー情報 更新日:2025/6/9',disc:'当店のアレルギー情報は、食品表示法で表示が義務付けられている8品目(特定原材料)を対象としています。当店では低アレルギーなどのアレルギー対応メニューのご提供はございません。店舗での調理では多くの食材を使用するため、他の食材に由来するアレルギー物質との接触(コンタミネーション/交差混入)があります。アレルゲンに対する感受性は個人によって大きく異なり、その時々の体調によっても異なります。ご利用の際は最新の情報を参考に、かかりつけの専門医にご相談のうえ、お客様ご自身でご判断ください。',close:'閉じる'},
en:{welcome:'Welcome to Mia Bocca. Thank you very much for dining with us today. Please relax and enjoy our Italian cuisine made with ingredients from Hokkaido.',title:'Menu & Allergen Information',lead:'Tap any dish to see whether it contains the 8 specified allergens: shrimp, crab, walnut, wheat, buckwheat, egg, milk and peanut.',cta:'View the menu',fh:'Allergens to avoid',fp:'Dishes that use the selected ingredients will be dimmed.',tri:'Also dim dishes with shared production lines (▲)',th:'Allergen Chart',ts:'8 Specific Raw Materials',o:'Used as an ingredient',t:'Shared production line / possible contact',n:'Not used as an ingredient',tax:'tax incl.',contains:'Contains',unk:'This dish is not listed on the allergen chart. Please ask our staff.',all:'Allergen chart',other:'Others (chart only)',upd:'Allergen info updated: 9 Jun 2025',disc:'Our allergen information covers the 8 specific raw materials that Japanese food labeling law requires to be shown. We do not offer allergen-free menus. Because many ingredients are handled in our kitchen, cross-contact (contamination) with allergens from other ingredients may occur. Sensitivity differs greatly from person to person and with your condition on the day. Please consult your doctor and make your own judgment based on the latest information.',close:'Close'},
zt:{welcome:'歡迎光臨 Mia Bocca。衷心感謝您今日的蒞臨。請慢慢享用以北海道食材製作的義大利料理。',title:'菜單與過敏原資訊',lead:'點選料理即可查看8種特定原材料(蝦、蟹、核桃、小麥、蕎麥、蛋、乳、花生)的使用情況。',cta:'查看菜單',fh:'想避免的食材',fp:'選擇後,使用該食材的料理會變淡顯示。',tri:'生產線共用・接觸(▲)的料理也變淡顯示',th:'過敏原一覽表',ts:'特定原材料 8項',o:'作為原料使用',t:'原料生產線有共用・接觸',n:'未作為原料使用',tax:'含稅',contains:'含有',unk:'此料理未列於過敏原表中,請洽詢店員。',all:'過敏原表',other:'其他(僅列於表中)',upd:'過敏原資訊更新日:2025/6/9',disc:'本店的過敏原資訊以日本食品標示法規定須標示的8項特定原材料為對象。本店不提供低過敏等過敏對應菜單。由於店內烹調使用多種食材,可能與其他食材來源的過敏物質接觸(交叉污染)。對過敏原的敏感度因人而異,也會因當時身體狀況而不同。請參考最新資訊,並諮詢您的主治醫師後自行判斷。',close:'關閉'},
zs:{welcome:'欢迎光临 Mia Bocca。衷心感谢您今日的光临。请慢慢享用以北海道食材制作的意大利料理。',title:'菜单与过敏原信息',lead:'点击菜品即可查看8种特定原材料(虾、蟹、核桃、小麦、荞麦、蛋、乳、花生)的使用情况。',cta:'查看菜单',fh:'想避免的食材',fp:'选择后,使用该食材的菜品会变淡显示。',tri:'生产线共用・接触(▲)的菜品也变淡显示',th:'过敏原一览表',ts:'特定原材料 8项',o:'作为原料使用',t:'原料生产线有共用・接触',n:'未作为原料使用',tax:'含税',contains:'含有',unk:'此菜品未列于过敏原表中,请咨询店员。',all:'过敏原表',other:'其他(仅列于表中)',upd:'过敏原信息更新日:2025/6/9',disc:'本店的过敏原信息以日本食品标示法规定须标示的8项特定原材料为对象。本店不提供低过敏等过敏对应菜单。由于店内烹调使用多种食材,可能与其他食材来源的过敏物质接触(交叉污染)。对过敏原的敏感度因人而异,也会因当时身体状况而不同。请参考最新信息,并咨询您的主治医生后自行判断。',close:'关闭'},

{const p=new URLSearchParams(location.search).get('lang');const m=p&&LANGS.find(l=>l[0]===p||l[2].toLowerCase()===p.toLowerCase());if(m)lang=m[0]}
